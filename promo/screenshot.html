<h1>スーパー動画再生早丸君 — ストア用スクリーンショット生成</h1>
<p class="desc">
  下のボタンで 1280×800 の PNG を保存できます。個人情報は一切含まれません。<br>
  Chrome ウェブストアには最低1枚（最大5枚）必要です。3枚とも登録するのがおすすめです。
</p>

<p><button class="all" onclick="downloadAll()">3枚まとめてダウンロード</button></p>

<div class="card">
  <h2>1. プレイリスト除外（この拡張の目玉）</h2>
  <canvas id="c1" width="1280" height="800"></canvas>
  <button onclick="save(1)">この画像を保存</button>
</div>

<div class="card">
  <h2>2. ポップアップの機能紹介</h2>
  <canvas id="c2" width="1280" height="800"></canvas>
  <button onclick="save(2)">この画像を保存</button>
</div>

<div class="card">
  <h2>3. キーボード操作</h2>
  <canvas id="c3" width="1280" height="800"></canvas>
  <button onclick="save(3)">この画像を保存</button>
</div>

const FONT   = '"Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif';
const INK    = '#1f2328';
const SUB    = '#5f6368';
const BLUE   = '#1a73e8';
const GREEN  = '#188038';
const RED    = '#d93025';
const LINE   = '#dbe1e8';
const PAPER  = '#ffffff';
const WASH   = '#f3f6fa';

const icon = new Image();

/* ---------- 描画ヘルパ ---------- */

function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}

function txt(g, s, x, y, o) {
  o = o || {};
  g.save();
  g.fillStyle = o.color || INK;
  g.textAlign = o.align || 'left';
  g.textBaseline = o.baseline || 'alphabetic';
  g.font = (o.weight || 400) + ' ' + (o.size || 24) + 'px ' + FONT;
  g.fillText(s, x, y);
  g.restore();
}

function shadowCard(g, x, y, w, h, r) {
  g.save();
  g.shadowColor = 'rgba(20,30,50,.13)';
  g.shadowBlur = 18;
  g.shadowOffsetY = 4;
  g.fillStyle = PAPER;
  rr(g, x, y, w, h, r);
  g.fill();
  g.restore();
  g.strokeStyle = LINE;
  g.lineWidth = 1;
  rr(g, x, y, w, h, r);
  g.stroke();
}

/* 各画像の共通ヘッダー（アイコン＋名前） */
function header(g) {
  g.save();
  g.beginPath();
  g.arc(74 + 26, 62 + 26, 26, 0, Math.PI * 2);
  g.closePath();
  g.clip();
  g.drawImage(icon, 74, 62, 52, 52);
  g.restore();
  txt(g, 'スーパー動画再生早丸君', 140, 82, { size: 25, weight: 700 });
  txt(g, 'Chrome 拡張機能 ／ 外部通信なし', 140, 108, { size: 15, color: SUB });
}

function bg(g) {
  g.fillStyle = PAPER;
  g.fillRect(0, 0, 1280, 800);
  const grd = g.createLinearGradient(0, 0, 1280, 0);
  grd.addColorStop(0, '#1a73e8');
  grd.addColorStop(1, '#4fc3a1');
  g.fillStyle = grd;
  g.fillRect(0, 0, 1280, 8);
}

/* ---------- 2枚目: ポップアップ紹介 ---------- */

function popupMock(g, x, y) {
  const w = 420, h = 596;
  shadowCard(g, x, y, w, h, 12);

  // ヘッダー
  txt(g, '⏻', x + 24, y + 46, { size: 22, color: BLUE });
  txt(g, '早丸君', x + 58, y + 46, { size: 21, weight: 700 });
  txt(g, '1.80x', x + w - 24, y + 48, { size: 25, weight: 700, color: BLUE, align: 'right' });
  g.strokeStyle = LINE; g.beginPath();
  g.moveTo(x, y + 66); g.lineTo(x + w, y + 66); g.stroke();

  // プリセット
  const pre = ['0.25','0.50','0.75','0.90','1.00','1.10','1.25','1.50','1.80','2.00','3.00','16.0'];
  const bw = 116, bh = 40;
  for (let i = 0; i < 12; i++) {
    const cx = x + 24 + (i % 3) * (bw + 12);
    const cy = y + 88 + Math.floor(i / 3) * (bh + 10);
    const on = pre[i] === '1.80';
    g.fillStyle = on ? BLUE : PAPER;
    rr(g, cx, cy, bw, bh, 7); g.fill();
    g.strokeStyle = on ? BLUE : LINE; g.stroke();
    txt(g, pre[i], cx + bw / 2, cy + 27,
        { size: 17, align: 'center', color: on ? '#fff' : (pre[i] === '16.0' ? RED : INK) });
  }

  // スライダー
  const sy = y + 300;
  ['0.25','0.5','1','2','4','8','16'].forEach(function (t, i) {
    txt(g, t, x + 26 + i * 61, sy, { size: 12, color: SUB, align: 'center' });
  });
  g.strokeStyle = '#c9d1da'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + 26, sy + 20); g.lineTo(x + w - 26, sy + 20); g.stroke();
  g.strokeStyle = BLUE;
  g.beginPath(); g.moveTo(x + 26, sy + 20); g.lineTo(x + 240, sy + 20); g.stroke();
  g.fillStyle = BLUE; g.beginPath(); g.arc(x + 240, sy + 20, 11, 0, Math.PI * 2); g.fill();
  g.strokeStyle = RED; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x + 270, sy + 8); g.lineTo(x + 270, sy + 32); g.stroke();
  txt(g, '4.0 倍より右は音声が出ません', x + 26, sy + 48, { size: 12, color: RED });

  // 適用範囲
  txt(g, 'この速度を適用する範囲', x + 24, sy + 88, { size: 13, weight: 600, color: SUB });
  const rows = [['全体（既定）', '1.80x', true], ['このサイト', '未設定', false],
                ['このプレイリスト', '未設定', false], ['この動画だけ', '未設定', false]];
  rows.forEach(function (r, i) {
    const ry = sy + 100 + i * 34;
    if (r[2]) { g.fillStyle = '#e8f0fe'; rr(g, x + 18, ry, w - 36, 30, 6); g.fill(); }
    txt(g, r[0], x + 28, ry + 21, { size: 15 });
    txt(g, r[1], x + w - 28, ry + 21,
        { size: 14, align: 'right', color: r[2] ? BLUE : SUB, weight: r[2] ? 600 : 400 });
  });

  // 除外リスト
  txt(g, '除外中のプレイリスト (1件)', x + 24, sy + 262, { size: 13, weight: 600, color: SUB });
  g.strokeStyle = BLUE; g.fillStyle = '#e8f0fe';
  rr(g, x + 18, sy + 274, w - 36, 42, 7); g.fill(); g.stroke();
  txt(g, '音楽', x + 30, sy + 296, { size: 15 });
  txt(g, '1.00x', x + w - 34, sy + 300, { size: 14, align: 'right', color: GREEN, weight: 600 });
}

function keycap(g, x, y, label, caption, sub) {
  const w = 132, h = 132;
  g.save();
  g.shadowColor = 'rgba(20,30,50,.18)';
  g.shadowBlur = 14; g.shadowOffsetY = 5;
  g.fillStyle = PAPER;
  rr(g, x, y, w, h, 16); g.fill();
  g.restore();
  g.strokeStyle = '#c9d1da'; g.lineWidth = 2;
  rr(g, x, y, w, h, 16); g.stroke();
  g.fillStyle = '#eef2f7';
  rr(g, x + 10, y + 10, w - 20, h - 26, 10); g.fill();
  txt(g, label, x + w / 2, y + 90, { size: 62, weight: 700, align: 'center' });
  txt(g, caption, x + w / 2, y + 176, { size: 23, weight: 700, align: 'center' });
  txt(g, sub, x + w / 2, y + 206, { size: 15, align: 'center', color: SUB });
}

function scene3() {
  const g = document.getElementById('c3').getContext('2d');
  bg(g);
  header(g);

  txt(g, 'キーボードだけでも操作できる', 74, 212, { size: 48, weight: 700 });
  txt(g, 'マウスを動かさずに、再生しながら調整。', 74, 258, { size: 24, color: SUB });

  const keys = [
    ['D', '速く', '+0.25 倍'],
    ['S', '遅く', '-0.25 倍'],
    ['R', 'リセット', '等倍に戻す'],
    ['Z', '戻す', '10 秒'],
    ['X', '進める', '10 秒']
  ];
  keys.forEach(function (k, i) {
    keycap(g, 108 + i * 218, 330, k[0], k[1], k[2]);
  });

  g.fillStyle = WASH;
  rr(g, 74, 616, 1132, 116, 12); g.fill();
  txt(g, '誤操作しないように作ってあります', 110, 662, { size: 23, weight: 700 });
  txt(g, '検索窓やコメント欄にカーソルがある間は反応しません。日本語入力の変換中も無効です。',
      110, 696, { size: 17, color: SUB });
  txt(g, 'Ctrl / Alt との同時押しでも動かないので、ブラウザの操作を邪魔しません。',
      110, 722, { size: 17, color: SUB });
}

/* ---------- 保存 ---------- */

function save(n) {
  document.getElementById('c' + n).toBlob(function (blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hayamaru-store-' + n + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }, 'image/png');
}

function downloadAll() {
  [1, 2, 3].forEach(function (n, i) { setTimeout(function () { save(n); }, i * 700); });
}

icon.onload = function () { scene1(); scene2(); scene3(); };
icon.onerror = function () { alert('アイコン画像を読み込めませんでした。'); };
icon.src = ICON_SRC;
